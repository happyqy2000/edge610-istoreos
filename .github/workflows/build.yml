name: Build Edge610 APK for iStoreOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 準備環境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev subversion libssl-dev gawk flex bison


      - name: 複製 iStoreOS/OpenWrt 25.12 原始碼
        run: |
          # 直接從 GitHub 克隆穩定分支，完全不需下載任何 .tar.xz 壓縮包
          git clone --depth 1 -b openwrt-25.12 https://github.com sdk

      - name: 配置工具鏈與建立 Makefile
        run: |
          cd sdk
          mkdir -p package/kernel/edge610
          
          cat << 'EOF' > package/kernel/edge610/Makefile
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk

          PKG_NAME:=edge610
          PKG_RELEASE:=1
          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com
          PKG_SOURCE_VERSION:=main

          include $(INCLUDE_DIR)/package.mk

          define KernelPackage/edge610
            SUBMENU:=Network Devices
            TITLE:=Board support for SD-WAN Edge 610
            DEPENDS:=+kmod-mii +kmod-i2c-core +kmod-ixgbe
            FILES:= \
              $(PKG_BUILD_DIR)/src/edge610_switch_standalone.ko \
              $(PKG_BUILD_DIR)/src/edge610_dsa.ko
            AUTOLOAD:=$(delay) 30 edge610_switch_standalone edge610_dsa
          enddefine

          define Build/Compile
              $(KERNEL_MAKE) M="$(PKG_BUILD_DIR)/src" modules
          enddefine

          $(eval $(call KernelPackage,edge610))
          EOF

      - name: 產生 x86_64 預設組態
        run: |
          cd sdk
          # 設定目標為 x86 / 64 位元架構
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          make defconfig

      - name: 雲端線上編譯 APK
        run: |
          cd sdk
          # 只編譯所需的工具鏈和 edge610 套件
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make package/kernel/edge610/compile V=s

      - name: 上傳編譯好的 APK 安裝包
        uses: actions/upload-artifact@v4
        with:
          name: edge610-istoreos-apk
          path: sdk/bin/targets/x86/64/packages/*.apk
